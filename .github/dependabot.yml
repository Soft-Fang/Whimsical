# Dependabot：自动检查依赖更新并提 PR
# 文档：https://docs.github.com/code-security/dependabot
version: 2
updates:
  # npm 依赖（Astro / Tailwind 等）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "20:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 次版本 + 补丁版本合并成 1 个 PR，减少噪音
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions（actions/checkout、deploy-pages 等）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"